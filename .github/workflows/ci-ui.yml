name: Проверка интерфейса (TypeScript)

on:
  push:
    branches: [main]
    paths: ['ui/**']
  pull_request:
    paths: ['ui/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
