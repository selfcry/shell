name: "Сборка: сервер клуба (Server, Linux)"

on:
  push:
    branches: [main]
    paths:
      - 'src/ClubShell.Server/**'
      - 'deploy/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'src/ClubShell.Server/**'
      - 'deploy/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Публикация ClubShell.Server
        run: dotnet publish src/ClubShell.Server -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Файлы развёртывания
        run: cp -r deploy out/deploy
      - uses: actions/upload-artifact@v4
        with:
          name: ClubShell.Server-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 30
