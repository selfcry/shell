name: "Сборка: сервер клуба (Server, Linux и Windows)"

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/ClubShell.Server/**'
      - 'deploy/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'src/ClubShell.Server/**'
      - 'deploy/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Публикация ClubShell.Server
        run: dotnet publish src/ClubShell.Server -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out
      - name: Файлы развёртывания
        run: cp -r deploy out/deploy
      - name: Упаковка в zip
        run: (cd out && zip -qr "../ClubShell.Server-${{ matrix.rid }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: ClubShell.Server-${{ matrix.rid }}
          path: ClubShell.Server-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 30

  # Выкладываем в GitHub Releases только после успешной сборки и только для main и тегов v*.
  # main обновляет «скользящий» релиз latest, тег v1.2.3 создаёт отдельный релиз с этим именем.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClubShell.Server-*
          path: dist
          merge-multiple: true
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; PRE=""
          else
            TAG="latest"; PRE="--prerelease"
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $PRE --title "$TAG" --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}. В архивах готовые программы: распакуйте и запустите." || sleep 5
          fi
          gh release upload "$TAG" dist/*.zip --clobber
