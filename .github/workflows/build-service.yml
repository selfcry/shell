name: Сборка: служба-страж (Service)

on:
  push:
    branches: [main]
    paths:
      - 'src/ClubShell.Service/**'
      - 'src/ClubShell.Core/**'
      - '.github/workflows/build-service.yml'
  pull_request:
    paths:
      - 'src/ClubShell.Service/**'
      - 'src/ClubShell.Core/**'
      - '.github/workflows/build-service.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Публикация ClubShell.Service
        run: dotnet publish src/ClubShell.Service -c Release -r win-x64 --self-contained true  -o out

      - uses: actions/upload-artifact@v4
        with:
          name: ClubShell.Service-win-x64
          path: out
          if-no-files-found: error
          retention-days: 30
