name: Сборка интерфейса
description: Собирает ui/dist (Vite), который затем попадает в exe рядом с программой
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: npm ci и сборка
      shell: bash
      working-directory: ui
      run: |
        npm ci
        npm run build
