# Сервер клуба «Мираж PRO» (ClubShell.Server на 127.0.0.1:5080), домен cryvx.ru
# Реальный IP клиента берётся из PROXY-заголовка SNI-роутера: на VDS это включено глобально
# в /etc/nginx/conf.d/proxy-protocol-realip.conf (set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol).

# Лимиты частоты по IP: админ-API, вход/регистрация гостей, остальное API ПК.
limit_req_zone $binary_remote_addr zone=cryvx_admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cryvx_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cryvx_api:10m rate=30r/s;
limit_req_status 429;

# HTTP: только проверка домена для Let's Encrypt и перенаправление на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cryvx.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cryvx-acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_upgrade $cryvx_conn_upgrade {
    default upgrade;
    ""      close;
}

# HTTPS: сюда приходит трафик от SNI-роутера (stream.d/sni-router.conf) с заголовком PROXY.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    http2 on;
    server_name cryvx.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cryvx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryvx.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cryvx_ssl:10m;
    ssl_session_timeout 1d;

    # Обычным запросам хватает 64 КБ; больше можно только обложкам и тесту скорости (ниже).
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Общие настройки проксирования к приложению.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # ---------- веб-админка ----------
    # Ключ лежит в браузере, поэтому страница строго закрыта: только свои скрипты, нельзя встроить во фрейм.
    location = /admin { return 301 /admin/; }
    location /admin/assets/ {
        alias /var/www/clubshell-admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /admin/ {
        alias /var/www/clubshell-admin/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ---------- API администратора ----------
    location ~ ^/api/admin/apps/[a-z0-9_-]+/cover$ {
        client_max_body_size 3m;
        limit_req zone=cryvx_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }
    location /api/admin/ {
        limit_req zone=cryvx_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }

    # ---------- вход и регистрация гостей: перебор паролей ----------
    location ~ ^/api/pc/(login|register)$ {
        limit_req zone=cryvx_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }

    # ---------- тест скорости: без буферизации, иначе nginx исказит замер ----------
    location /api/pc/speedtest/ {
        client_max_body_size 6m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:5080;
    }

    # ---------- WebSocket ПК: пинг каждые 20 с, поэтому 120 с тишины = обрыв ----------
    location = /ws/pc {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cryvx_conn_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:5080;
    }

    # ---------- кабинет гостя: вход и регистрация (перебор паролей), остальное API кабинета ----------
    location ~ ^/api/guest/(login|register)$ {
        limit_req zone=cryvx_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }
    location /api/guest/ {
        limit_req zone=cryvx_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }

    # ---------- остальное сервера клуба: API ПК, обложки, проверка ----------
    location /api/pc/ {
        limit_req zone=cryvx_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5080;
    }
    location /covers/ { proxy_pass http://127.0.0.1:5080; }
    location = /health { proxy_pass http://127.0.0.1:5080; }

    # ---------- всё прочее — сайт с личным кабинетом (Next.js) ----------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location / {
        limit_req zone=cryvx_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
}
