# Сервер клуба «Мираж PRO» (ClubShell.Server на 127.0.0.1:5080), домен cryvx.ru
# HTTP: только проверка домена для Let's Encrypt и перенаправление на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cryvx.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cryvx-acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_upgrade $cryvx_conn_upgrade {
    default upgrade;
    ""      close;
}

# HTTPS: сюда приходит трафик от SNI-роутера (stream.d/sni-router.conf) с заголовком PROXY.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    http2 on;
    server_name cryvx.ru;

    ssl_certificate /etc/letsencrypt/live/cryvx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryvx.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;   # обложки игр

    # Веб-админка (собранный ui: admin.html как index.html и assets). Ключ вводится на странице, API защищено ключом на сервере.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /var/www/clubshell-admin/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket ПК (/ws/pc)
        proxy_set_header Connection $cryvx_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;                         # WebSocket живёт долго
        proxy_send_timeout 3600s;
    }
}
